name: Offline evidence validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest pyyaml reuse==5.1.1
      - name: Verify file-level licensing
        run: reuse lint
      - run: python -m pytest -q
      - name: Parse JSON and YAML data files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          for path in Path(".").rglob("*.json"):
              json.loads(path.read_text())
          for suffix in ("*.yaml", "*.yml"):
              for path in Path(".").rglob(suffix):
                  yaml.safe_load(path.read_text())
          PY
